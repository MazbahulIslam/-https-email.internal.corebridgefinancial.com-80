<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Greeting — Md. Mazbahul Islam</title>
  <style>
    /* Simple centered card */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg,#f5f7fa,#e2e8f0);
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.6rem;
      color: #0f172a;
    }
    p { margin: 0; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi, I am Md. Mazbahul Islam</h1>
    <p>Welcome — this is a simple HTML greeting.</p>
  </div>
</body>
</html>
